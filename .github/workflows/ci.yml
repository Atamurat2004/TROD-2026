# CI/CD (lab-2) для приложения Sports Store из lab-1/app.
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Vars (optional): DOCKER_IMAGE_NAME (default lab1-app)

name: CI/CD (lab-2)

on:
  pull_request:
    paths:
      - "lab-1/**"
      - "lab-2/**"
      - ".github/workflows/ci.yml"
      - ".gitlab-ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "lab-1/**"
      - "lab-2/**"
      - ".github/workflows/ci.yml"
      - ".gitlab-ci.yml"

env:
  DOCKER_IMAGE_LOCAL: lab1-app
  PYTHON_VERSION: "3.12"
  APP_DIR: lab-1/app
  LAB2_DIR: lab-2

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-1/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r ../../lab-2/requirements-dev.txt
      - name: Verify bytecode compile
        run: python -m compileall -q src

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-1/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r ../../lab-2/requirements-dev.txt
      - name: Ruff check
        run: ruff check . --config ../../lab-2/pyproject.toml
      - name: Ruff format
        run: ruff format --check . --config ../../lab-2/pyproject.toml

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-1/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r ../../lab-2/requirements-dev.txt
      - name: Pytest with coverage
        run: |
          pytest \
            --cov=src \
            --cov-config=../../lab-2/pyproject.toml \
            --cov-report=term \
            --cov-report=html \
            --cov-report=xml \
            --cov-fail-under=50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-lab2
          path: lab-1/app/htmlcov/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-lab2
          path: lab-1/app/coverage.xml

  docker_build:
    runs-on: ubuntu-latest
    needs: [build, lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./lab-1/app
          file: ./lab-1/app/Dockerfile
          push: false
          tags: |
            ${{ env.DOCKER_IMAGE_LOCAL }}:${{ steps.sha.outputs.short }}
          outputs: type=docker,dest=/tmp/image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-lab2
          path: /tmp/image.tar

  docker_push:
    runs-on: ubuntu-latest
    needs: [docker_build]
    if: >-
      success() && needs.docker_build.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image-lab2
          path: .
      - name: Проверка секретов Docker Hub
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Задайте secrets репозитория: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN"
            exit 1
          fi
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Load and push
        run: |
          NAME="${IMAGE_NAME:-lab1-app}"
          docker load -i image.tar
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REF_SLUG="${GITHUB_REF_NAME//\//-}"
          LOCAL_TAG="${{ env.DOCKER_IMAGE_LOCAL }}:${SHORT_SHA}"
          docker tag "$LOCAL_TAG" "${DOCKERHUB_USERNAME}/${NAME}:${SHORT_SHA}"
          docker tag "$LOCAL_TAG" "${DOCKERHUB_USERNAME}/${NAME}:${REF_SLUG}"
          docker push "${DOCKERHUB_USERNAME}/${NAME}:${SHORT_SHA}"
          docker push "${DOCKERHUB_USERNAME}/${NAME}:${REF_SLUG}"
